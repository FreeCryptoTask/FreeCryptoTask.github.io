<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Hub | Professional Connect</title>
    
    <script>(function(s){s.dataset.zone='10834197',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

    <style>
        :root {
            --bg-color: #050505;
            --card-bg: rgba(20, 20, 20, 0.8);
            --accent: #00d2ff;
            --accent-hover: #3a7bd5;
            --text-white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background: var(--bg-color);
            background: radial-gradient(circle at top right, #1a1a1a, #050505);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .profile-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .avatar {
            width: 90px;
            height: 90px;
            background: linear-gradient(45deg, var(--accent), var(--accent-hover));
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
        }

        h1 { font-size: 1.6rem; margin-bottom: 5px; }
        p { font-size: 0.9rem; color: #aaa; margin-bottom: 25px; }

        .links-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 30px;
        }

        .link-card {
            display: block;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .link-card:hover {
            background: var(--accent);
            color: #000;
            transform: scale(1.02);
            box-shadow: 0 10px 20px rgba(0, 210, 255, 0.2);
        }

        /* Ad Section Styling */
        .ad-container {
            width: 100%;
            max-width: 480px;
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 15px;
            text-align: center;
        }

        .ad-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #555;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <div class="avatar">S</div>
        <h1>Social Connect</h1>
        <p>Premium Content & Links</p>

        <div class="links-grid">
            <a href="#" class="link-card">Exclusive Content</a>
            <a href="#" class="link-card">Join Telegram</a>
            <a href="#" class="link-card">Official Shop</a>
            <a href="#" class="link-card">Latest Project</a>
        </div>

        <p style="font-size: 12px; opacity: 0.5;">© 2026 Advanced Social Page</p>
    </div>

    <div class="ad-container">
        <div class="ad-label">Sponsored</div>

    </div>

</body>
</html>
